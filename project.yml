name: Kanal
options:
  bundleIdPrefix: com.bomann
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

packages:
  KanalKit:
    path: Packages/KanalKit

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JWL8576LU4
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Kanal:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: App/iOS/Assets.xcassets
      - path: App/iOS/PrivacyInfo.xcprivacy
    dependencies:
      - package: KanalKit
        product: KanalCore
      - package: KanalKit
        product: KanalUI
      # Stable VLC 3.7.3. Run Scripts/fetch-vlc.sh once after cloning.
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomann.kanal
        PRODUCT_NAME: Kanal
        INFOPLIST_FILE: App/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  KanalTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Shared
      - path: App/tvOS
      - path: App/tvOS/Assets.xcassets
      - path: App/tvOS/PrivacyInfo.xcprivacy
    dependencies:
      - package: KanalKit
        product: KanalCore
      - package: KanalKit
        product: KanalUI
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomann.kanal
        PRODUCT_NAME: Kanal
        INFOPLIST_FILE: App/tvOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_PREVIEWS: YES

  KanalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Kanal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomann.kanal.uitests
        TEST_TARGET_NAME: Kanal
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kanal:
    build:
      targets:
        Kanal: all
        KanalUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KanalUITests
  KanalTV:
    build:
      targets:
        KanalTV: all
    run:
      config: Debug
