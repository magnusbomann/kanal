name: Kanal
options:
  bundleIdPrefix: com.bomann
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

packages:
  KanalKit:
    path: Packages/KanalKit
  # AVFoundation cannot open Matroska, and 99.5% of a real provider's film
  # catalogue is MKV. VLCKit decodes it — this is the difference between a
  # player that works on live TV only and one that works.
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    # Pinned by commit: VLCKit's tags ("4.0.0-a23") are not semver, so SPM
    # cannot resolve them by version.
    revision: 5e6229f924f03d93e976687199bc2c81795e7478

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JWL8576LU4
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Kanal:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: App/iOS/Assets.xcassets
      - path: App/iOS/PrivacyInfo.xcprivacy
    dependencies:
      - package: KanalKit
        product: KanalCore
      - package: KanalKit
        product: KanalUI
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomann.kanal
        PRODUCT_NAME: Kanal
        INFOPLIST_FILE: App/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  KanalTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Shared
      - path: App/tvOS
      - path: App/tvOS/Assets.xcassets
      - path: App/tvOS/PrivacyInfo.xcprivacy
    dependencies:
      - package: KanalKit
        product: KanalCore
      - package: KanalKit
        product: KanalUI
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomann.kanal
        PRODUCT_NAME: Kanal
        INFOPLIST_FILE: App/tvOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_PREVIEWS: YES

schemes:
  Kanal:
    build:
      targets:
        Kanal: all
    run:
      config: Debug
  KanalTV:
    build:
      targets:
        KanalTV: all
    run:
      config: Debug
